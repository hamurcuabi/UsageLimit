name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # GOOGLE_SERVICES_JSON secret'ı tanımlıysa Firebase yapılandırmasını derlemeye ekle.
      - name: Firebase yapılandırmasını yaz
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "google-services.json eklendi"
          else
            echo "GOOGLE_SERVICES_JSON tanımlı değil; bulut özellikleri kapalı derleniyor"
          fi

      - name: APK derle
        run: ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --stacktrace

      - name: APK'yı adlandır
        run: cp app/build/outputs/apk/release/app-release.apk UsageLimit.apk

      - uses: actions/upload-artifact@v4
        with:
          name: UsageLimit-apk
          path: UsageLimit.apk

      - name: Release yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.${{ github.run_number }}" UsageLimit.apk \
            --title "v0.1.${{ github.run_number }}" \
            --notes "Otomatik derleme: ${{ github.sha }}" \
            --target "${{ github.sha }}"
